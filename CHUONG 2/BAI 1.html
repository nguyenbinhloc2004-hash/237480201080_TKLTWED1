<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Du lịch Bạc Liêu</title>
    <style>
        /* Gom tất cả "thời trang" vào đây */
        body {
            background-color: #f9f9f9; /* Thêm màu nền nhạt cho sang */
            line-height: 1.6;
        }

        .company-name {
            font-family: Tahoma, sans-serif;
            font-size: 25px;
            font-weight: bold;
            color: rgb(212, 0, 255);
        }

        h1 {
            text-align: center;
            color: #2c3e50; /* Màu xanh đen chuyên nghiệp */
            text-transform: uppercase;
        }

        .greeting {
            font-family: 'Times New Roman', serif;
            font-size: 18px; /* Tăng nhẹ cho dễ đọc */
            font-style: italic;
            font-weight: bold;
            text-align: center;
            color: #555;
        }
    </style>
</head>
<body>

    <p class="company-name">Công ty du lịch Bạc Liêu</p>

    <h1>DU LỊCH BẠC LIÊU</h1>

    <p class="greeting">Kính chào quý khách!</p>

</body>
</html>
