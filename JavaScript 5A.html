<!DOCTYPE html>
<html>
<body>

    <script>
        var D = new Date();
        // Cập nhật tiêu đề của trang web (thanh tab trình duyệt)
        document.title = "Bay gio la : " + D.getHours() + " gio " + D.getMinutes() + " phut.";
        
        // Thanh hiển thị ra màn hình thay vì chỉ ở tiêu đề, hãy dùng dòng dưới đây:
        document.write("Bay gio la : " + D.getHours() + " gio " + D.getMinutes() + " phut.");
    </script>

</body>
</html>
