<body>

    <h2>Ví dụ về sự kiện onClick trong JavaScript</h2>

    <input type="button" value="Câu 1: Alert" 
           onclick="alert('Hello world');">

    <br><br>

    <input type="button" value="Câu 2: Document Write" 
           onclick="document.write('chao mung den voi binh nguyen vo tan ');">

    <br><br>

    <input type="button" value="Câu 3: Tính tổng x + y" 
           onclick="var x,y; x = 10; y = 20; alert('Tổng là : ' + (x + y));">

</body>
</html>
